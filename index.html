<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torneo Città dell'Infiorata 2026 - Referto Arbitri</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: #f3f6fb; color: #1c2430; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .grid { display: grid; gap: 12px; }
    .grid-3 { grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
    label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
    select, input, textarea, button { width: 100%; padding: 10px; border: 1px solid #c9d3e0; border-radius: 8px; box-sizing: border-box; }
    input[type="text"], textarea { text-transform: uppercase; }
    textarea { min-height: 80px; }
    button { cursor: pointer; border: none; background: #2f67c7; color: white; font-weight: 600; }
    button.secondary { background: #4d5b6c; }
    button.warn { background: #b03737; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > button { flex: 1; min-width: 180px; }
    .muted { color: #5d6875; font-size: 14px; }
    .result-list { max-height: 280px; overflow:auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #e6ebf3; padding: 8px; text-align: left; }
    .score-input { max-width: 90px; }
    .checkline { display:flex; align-items:center; gap:8px; margin-top:6px; }
    .checkline input { width:auto; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Referto arbitri - Torneo Città dell'Infiorata 2026</h1>
  <p class="muted">Periodo torneo: dal 29 maggio 2026 al 21 giugno 2026 (Genzano di Roma).</p>

  <div class="card">
    <h3>1) Inserimento gara</h3>
    <div class="grid grid-3">
      <div><label for="dataGara">Data e ora</label><input id="dataGara" type="datetime-local" /></div>
      <div><label for="categoria">Categoria</label><select id="categoria"></select></div>
      <div><label for="girone">Girone</label><select id="girone"></select></div>
      <div><label for="giornata">Giornata</label><select id="giornata"></select></div>
      <div><label for="squadraCasa">Squadra casa</label><select id="squadraCasa"></select></div>
      <div><label for="squadraOspite">Squadra ospite</label><select id="squadraOspite"></select></div>
      <div><label for="campo">Campo</label><select id="campo"></select></div>
      <div><label for="arbitro">Arbitro</label><input id="arbitro" type="text" placeholder="NOME ARBITRO" /></div>
    </div>
  </div>

  <div class="card">
    <h3>2) Inserimento referto</h3>
    <div class="grid grid-3">
      <div><label>Gol casa</label><input class="score-input" id="golCasa" type="number" min="0" value="0" /></div>
      <div><label>Gol ospite</label><input class="score-input" id="golOspite" type="number" min="0" value="0" /></div>
          </div>
    <div class="grid grid-3">
      <div><label>Ammoniti casa (uno per riga)</label><textarea id="ammCasa"></textarea></div>
      <div><label>Ammoniti ospite (uno per riga)</label><textarea id="ammOspite"></textarea></div>
      <div>
        <label><input id="noAmmonitiCasa" type="checkbox" /> Nessun ammonito casa</label>
        <label><input id="noAmmonitiOspite" type="checkbox" /> Nessun ammonito ospite</label>
      </div>
    </div>
    <div class="grid grid-3">
      <div><label>Espulsi casa (uno per riga)</label><textarea id="espulsiCasa"></textarea></div>
      <div><label>Espulsi ospite (uno per riga)</label><textarea id="espulsiOspite"></textarea></div>
      <div>
        <label><input id="noEspulsiCasa" type="checkbox" /> Nessun espulso casa</label>
        <label><input id="noEspulsiOspite" type="checkbox" /> Nessun espulso ospite</label>
      </div>
    </div>
    <div><label>Note disciplinari / gara</label><textarea id="note"></textarea></div>
    <div class="row" style="margin-top:12px;">
      <button id="salva">Salva referto</button>
      <button class="secondary" id="nuovo">Pulisci campi</button>
    </div>
  </div>

  <div class="card">
    <h3>3) Referti inseriti</h3>
    <div class="grid grid-3" style="margin-bottom:10px;">
      <div>
        <label for="exportMode">Esporta</label>
        <select id="exportMode">
          <option value="current">Gara attualmente inserita</option>
          <option value="saved">Gara salvata (seleziona sotto)</option>
        </select>
      </div>
      <div>
        <label for="savedReferto">Gara salvata</label>
        <select id="savedReferto"></select>
      </div>
    </div>
    <div class="row">
      <button class="secondary" id="exportJson">Esporta JSON</button>
      <button class="secondary" id="exportCsv">Esporta CSV</button>
      <button class="secondary" id="exportPdf">Esporta PDF</button>
      <button class="warn" id="resetAll">Cancella tutti i referti</button>
    </div>
    <div class="result-list" style="margin-top:12px;">
      <table>
        <thead><tr><th>ID</th><th>Categoria</th><th>Gara</th><th>Risultato</th><th>Data inserimento</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const categorie = ['UNDER14','UNDER15','UNDER16','UNDER17','UNDER19'];
const gironi = ['A','B','SEMIFINALE','FINALE'];
const giornate = ['1','2','3','4','5','SEMIFINALE','FINALE'];
const squadre = ['ACADEMY CYNTHIA GENZANO','ACCADEMIA CALCIO FRASCATI','ACCADEMIA TORRENOVA','ALBACYNTHIA','ALBALONGA','ARICCIA CALCIO','ATLETICO LARIANO','BARBATO FOOTBALL ACADEMY','COLLEFERRO CALCIO','CYNTHIA 1920','DREAMING FOOTBALL ACADEMY','F. A. G. GIANNINI','NEXT GEN LODIGIANI','POLISPORTIVA CIAMPINO','PRO CALCIO CECCHINA','REAL APRILIA','VJS VELLETRI'];
const campi = ["CITTA' DELL'INFIORATA",'BRUNO ABBATINI'];
const k='torneo_referti_2026';
const qs=id=>document.getElementById(id);

function fillSelect(id, values, placeholder) {
  const first = `<option value="" selected disabled>${placeholder}</option>`;
  qs(id).innerHTML = first + values.map(v => `<option value="${v}">${v}</option>`).join('');
}
function loadReferti(){ return JSON.parse(localStorage.getItem(k)||'[]'); }

function init(){
  fillSelect('categoria', categorie, 'Seleziona categoria');
  fillSelect('girone', gironi, 'Seleziona girone');
  fillSelect('giornata', giornate, 'Seleziona giornata');
  fillSelect('squadraCasa', squadre, 'Seleziona squadra casa');
  fillSelect('squadraOspite', squadre, 'Seleziona squadra ospite');
  fillSelect('campo', campi, 'Seleziona campo');

  qs('dataGara').value = '';

  document.querySelectorAll('input[type="text"], textarea').forEach(el => el.addEventListener('input', () => { el.value = el.value.toUpperCase(); }));
  qs('salva').addEventListener('click',salvaReferto);
  qs('nuovo').addEventListener('click',pulisciCampi);
  qs('exportJson').addEventListener('click',exportJsonSingolo);
  qs('exportCsv').addEventListener('click',exportCsvSingolo);
  qs('exportPdf').addEventListener('click',exportPdfSingolo);
  qs('resetAll').addEventListener('click',()=>{if(confirm('Confermi cancellazione completa?')){localStorage.removeItem(k);renderReferti();}});
  renderReferti();
}

function pulisciCampi(){
  ['golCasa','golOspite','arbitro','ammCasa','ammOspite','espulsiCasa','espulsiOspite','note'].forEach(x=>qs(x).value=x.includes('gol')?'0':'');
  qs('noAmmonitiCasa').checked = false;
  qs('noAmmonitiOspite').checked = false;
  qs('noEspulsiCasa').checked = false;
  qs('noEspulsiOspite').checked = false;
}

function salvaReferto(){
  const casa = qs('squadraCasa').value;
  const ospite = qs('squadraOspite').value;
  const noAmmonitiCasa = qs('noAmmonitiCasa').checked;
  const noAmmonitiOspite = qs('noAmmonitiOspite').checked;
  const noEspulsiCasa = qs('noEspulsiCasa').checked;
  const noEspulsiOspite = qs('noEspulsiOspite').checked;
  const ammCasaCompilati = qs('ammCasa').value.trim();
  const ammOspiteCompilati = qs('ammOspite').value.trim();
  const espCasaCompilati = qs('espulsiCasa').value.trim();
  const espOspiteCompilati = qs('espulsiOspite').value.trim();

  if (!qs('dataGara').value || !qs('categoria').value || !qs('girone').value || !qs('giornata').value || !casa || !ospite || !qs('campo').value || !qs('arbitro').value.trim() || qs('golCasa').value === '' || qs('golOspite').value === '' || !qs('note').value.trim()) {
    return alert('Compila tutti i campi principali del referto prima di salvare.');
  }
  if (!noAmmonitiCasa && !ammCasaCompilati) return alert('Inserisci ammoniti casa o spunta Nessun ammonito casa.');
  if (!noAmmonitiOspite && !ammOspiteCompilati) return alert('Inserisci ammoniti ospite o spunta Nessun ammonito ospite.');
  if (!noEspulsiCasa && !espCasaCompilati) return alert('Inserisci espulsi casa o spunta Nessun espulso casa.');
  if (!noEspulsiOspite && !espOspiteCompilati) return alert('Inserisci espulsi ospite o spunta Nessun espulso ospite.');
  if (casa === ospite) return alert('Squadra casa e ospite non possono coincidere.');

  const all = loadReferti();
  const ref = {
    id: crypto.randomUUID(),
    dataOra: qs('dataGara').value,
    categoria: qs('categoria').value,
    girone: qs('girone').value,
    giornata: qs('giornata').value,
    campo: qs('campo').value,
    casa,
    ospite,
    risultato:`${Number(qs('golCasa').value)}-${Number(qs('golOspite').value)}`,
    arbitro:qs('arbitro').value.trim().toUpperCase(),
    ammonitiCasa:noAmmonitiCasa ? [] : qs('ammCasa').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    ammonitiOspite:noAmmonitiOspite ? [] : qs('ammOspite').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    espulsiCasa:noEspulsiCasa ? [] : qs('espulsiCasa').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    espulsiOspite:noEspulsiOspite ? [] : qs('espulsiOspite').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    nessunAmmonitoCasa:noAmmonitiCasa,
    nessunAmmonitoOspite:noAmmonitiOspite,
    nessunEspulsoCasa:noEspulsiCasa,
    nessunEspulsoOspite:noEspulsiOspite,
    note:qs('note').value.trim().toUpperCase(),
    inseritoIl:new Date().toISOString()
  };

  all.push(ref);
  localStorage.setItem(k,JSON.stringify(all));
  renderReferti();
  alert('Referto salvato correttamente.');
}

function renderReferti(){
  const rows=loadReferti().map(r=>`<tr><td>${r.id.slice(0,8)}</td><td>${r.categoria}</td><td>${r.casa} - ${r.ospite}<br><small>${r.dataOra} | ${r.girone} | ${r.giornata} | ${r.campo}</small></td><td>${r.risultato}</td><td>${new Date(r.inseritoIl).toLocaleString('it-IT')}</td></tr>`).join('');
  qs('tbody').innerHTML=rows||'<tr><td colspan="5">Nessun referto inserito.</td></tr>';
  refreshSavedRefertiSelect();
}

function refreshSavedRefertiSelect(){
  const all = loadReferti();
  qs('savedReferto').innerHTML = '<option value="">Seleziona gara salvata</option>' + all.map(r => `<option value="${r.id}">${r.dataOra} | ${r.casa} - ${r.ospite}</option>`).join('');
}

function getCurrentRefertoDraft(){
  return {
    id: 'DRAFT',
    dataOra: qs('dataGara').value,
    categoria: qs('categoria').value,
    girone: qs('girone').value,
    giornata: qs('giornata').value,
    campo: qs('campo').value,
    casa: qs('squadraCasa').value,
    ospite: qs('squadraOspite').value,
    risultato:`${Number(qs('golCasa').value)}-${Number(qs('golOspite').value)}`,
    arbitro:qs('arbitro').value.trim().toUpperCase(),
    ammonitiCasa:qs('noAmmonitiCasa').checked ? [] : qs('ammCasa').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    ammonitiOspite:qs('noAmmonitiOspite').checked ? [] : qs('ammOspite').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    espulsiCasa:qs('noEspulsiCasa').checked ? [] : qs('espulsiCasa').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    espulsiOspite:qs('noEspulsiOspite').checked ? [] : qs('espulsiOspite').value.split('\n').map(x=>x.trim().toUpperCase()).filter(Boolean),
    nessunAmmonitoCasa:qs('noAmmonitiCasa').checked,
    nessunAmmonitoOspite:qs('noAmmonitiOspite').checked,
    nessunEspulsoCasa:qs('noEspulsiCasa').checked,
    nessunEspulsoOspite:qs('noEspulsiOspite').checked,
    note:qs('note').value.trim().toUpperCase(),
    inseritoIl:new Date().toISOString()
  };
}

function getRefertoPerExport(){
  if (qs('exportMode').value === 'current') return getCurrentRefertoDraft();
  const selectedId = qs('savedReferto').value;
  const ref = loadReferti().find(r => r.id === selectedId);
  if (!ref) { alert('Seleziona una gara salvata da esportare.'); return null; }
  return ref;
}

function exportJsonSingolo(){
  const ref = getRefertoPerExport(); if(!ref) return;
  download(`referto_${ref.id}.json`, JSON.stringify(ref, null, 2), 'application/json');
}

function exportCsvSingolo(){
  const ref = getRefertoPerExport(); if(!ref) return;
  const head=['id','dataOra','categoria','girone','giornata','campo','casa','ospite','risultato','arbitro','ammonitiCasa','ammonitiOspite','espulsiCasa','espulsiOspite','nessunAmmonitoCasa','nessunAmmonitoOspite','nessunEspulsoCasa','nessunEspulsoOspite','note','inseritoIl'];
  const line=head.map(h=>`"${String(Array.isArray(ref[h])?ref[h].join('|'):ref[h]??'').replaceAll('"','""')}"`).join(';');
  download(`referto_${ref.id}.csv`,head.join(';')+'\n'+line,'text/csv;charset=utf-8;');
}


function exportPdfSingolo(){
  const r = getRefertoPerExport(); if(!r) return;
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Referto ${r.id}</title><style>body{font-family:Arial,sans-serif;padding:20px;font-size:13px;}h2{margin-top:0;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #999;padding:6px;vertical-align:top;} .blk{margin:10px 0;}</style></head><body><h2>Referto Gara - Torneo Città dell'Infiorata 2026</h2><div class="blk"><b>Categoria:</b> ${r.categoria} | <b>Girone:</b> ${r.girone} | <b>Giornata:</b> ${r.giornata}<br><b>Data/Ora:</b> ${r.dataOra} | <b>Campo:</b> ${r.campo}<br><b>Gara:</b> ${r.casa} - ${r.ospite} | <b>Risultato:</b> ${r.risultato}<br><b>Arbitro:</b> ${r.arbitro}</div><table><tr><th>Ammoniti Casa</th><th>Ammoniti Ospite</th></tr><tr><td>${r.nessunAmmonitoCasa?'NESSUNO':(r.ammonitiCasa||[]).join('<br>')}</td><td>${r.nessunAmmonitoOspite?'NESSUNO':(r.ammonitiOspite||[]).join('<br>')}</td></tr><tr><th>Espulsi Casa</th><th>Espulsi Ospite</th></tr><tr><td>${r.nessunEspulsoCasa?'NESSUNO':(r.espulsiCasa||[]).join('<br>')}</td><td>${r.nessunEspulsoOspite?'NESSUNO':(r.espulsiOspite||[]).join('<br>')}</td></tr></table><div class="blk"><b>Note:</b><br>${r.note||''}</div></body></html>`;
  const w = window.open('', '_blank');
  w.document.write(html); w.document.close(); w.focus(); w.print();
}

function download(name,content,type){
  const blob=new Blob([content],{type});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

init();
</script>
</body>
</html>
